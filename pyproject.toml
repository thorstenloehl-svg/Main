[project]
name = "grounded-answer"
version = "0.1.0"
description = "Web-grounded answers with citations via the Perplexity Agent API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["perplexityai>=0.48.1"]

[project.scripts]
grounded-answer = "grounded_answer.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grounded_answer"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
